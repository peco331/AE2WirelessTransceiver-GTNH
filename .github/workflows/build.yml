name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Determine build version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew clean build --no-daemon

      - name: Verify Java 8 class-file target
        run: |
          python3 - <<'PY'
          import pathlib
          import struct
          import zipfile

          jars = sorted(pathlib.Path("build/libs").glob("*.jar"))
          checked = 0
          failures = []
          for jar_path in jars:
              with zipfile.ZipFile(jar_path) as jar:
                  for name in jar.namelist():
                      if not name.endswith(".class"):
                          continue
                      data = jar.read(name)
                      if len(data) < 8 or data[:4] != b"\xca\xfe\xba\xbe":
                          failures.append(f"{jar_path}:{name}: invalid class header")
                          continue
                      major = struct.unpack(">H", data[6:8])[0]
                      checked += 1
                      if major != 52:
                          failures.append(f"{jar_path}:{name}: major={major}, expected 52")

          if checked == 0:
              raise SystemExit("No class files found in build/libs artifacts")
          if failures:
              raise SystemExit("\n".join(failures))
          print(f"Verified {checked} class files across {len(jars)} jar(s): major 52")
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ae2wtx-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
