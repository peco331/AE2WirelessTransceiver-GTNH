dependencies {
    // Versions matching the GTNH 2.9.0-beta3 client/server runtime.
    api("com.github.GTNewHorizons:Applied-Energistics-2-Unofficial:rv3-beta-1050-GTNH") {
        artifact { classifier = "dev" }
    }
    // GregTech 5 Unofficial, for GT wrench detection & crafting recipes.
    api("com.github.GTNewHorizons:GT5-Unofficial:5.09.54.133") {
        artifact { classifier = "dev" }
        exclude group: "com.github.GTNewHorizons", module: "waila"
    }
    // Development runtime for the optional JSON model integration. Production
    // clients without GTNHLib use the vanilla cube renderer instead.
    runtimeOnly("com.github.GTNewHorizons:GTNHLib:0.11.46") { artifact { classifier = "dev" } }
    // Optional integration only: Waila must not be pulled into the runtime jar or made mandatory.
    compileOnly("com.github.GTNewHorizons:waila:1.19.34") { artifact { classifier = "dev" } }
    testImplementation("junit:junit:4.13.2")
}
