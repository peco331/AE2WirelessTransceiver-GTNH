dependencies {
    // AE2 GTNH fork (Applied-Energistics-2-Unofficial), version matching pack 2.9.0-beta2.
    api("com.github.GTNewHorizons:Applied-Energistics-2-Unofficial:rv3-beta-1034-GTNH") { artifact { classifier = "dev" } }
    // GregTech 5 Unofficial, for GT wrench detection & crafting recipes.
    api("com.github.GTNewHorizons:GT5-Unofficial:5.09.52.594") {
        artifact { classifier = "dev" }
        exclude group: "com.github.GTNewHorizons", module: "waila"
    }
    // Development runtime for the optional JSON model integration. Production
    // clients without GTNHLib use the vanilla cube renderer instead.
    runtimeOnly("com.github.GTNewHorizons:GTNHLib:0.11.24") { artifact { classifier = "dev" } }
    // Optional integration only: Waila must not be pulled into the runtime jar or made mandatory.
    compileOnly("com.github.GTNewHorizons:waila:1.19.29") { artifact { classifier = "dev" } }
    testImplementation("junit:junit:4.13.2")
}
